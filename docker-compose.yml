services:
  retrace:
    image: ${DOCKER_IMAGE:-192.168.0.222:5050/retrace:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-retrace_app}
    restart: always
    ports:
      - "${APP_PORT:-8089}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TZ=Europe/Athens
    volumes:
      - /opt/retrace/data:/app/data
    labels:
      - project=retrace

