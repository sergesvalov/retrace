services:
  retrace:
    image: ${DOCKER_IMAGE:-192.168.0.222:5050/retrace:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-retrace_app}
    restart: always
    ports:
      - "${APP_PORT:-8089}:3001"
    # DATABASE_URL, TELEGRAM_BOT_TOKEN, SMTP_URL… — kept on the server, never in git
    env_file:
      - secrets.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TZ=Europe/Athens
      # Open to the internet through haproxy on 192.168.0.230 (homeservices): http://31.216.75.169:8252/retrace/
      # Its X-Forwarded-For is trusted, so rate limits count the real client address
      - TRUST_PROXY=192.168.0.230
    volumes:
      - /opt/retrace/data:/app/data
    labels:
      - project=retrace

